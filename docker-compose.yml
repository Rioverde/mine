services:
  storage:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mine
      POSTGRES_USER: mine
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mine:
    build: .
    restart: on-failure
    environment:
      STORAGE_DB_HOST: storage
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
    depends_on:
      - storage
