mine:
  buffer_size: 20
  delay: 100ms

merchant:
  buffer_size: 50
  delay: 2000ms

factory:
  out_buffer_size: 10
  scaler:
    min_workers: 1
    max_workers: 10
    scale_up_threshold: 15
    scale_down_threshold: 2
    check_interval: 200ms

ingot:
  max_quality: 100

item:
  max_quality: 100
  quality_bonus: 10
  number_of_items: 3

ore:
  max_capacity: 100
  number_of_ores: 3
  materials:
    - iron
    - copper
    - gold
