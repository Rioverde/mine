app:
  run_duration: 5s
  log_file: ./app.log

mine:
  buffer_size: 20
  tick_rate: 100ms

factory:
  out_buffer_size: 10
  scaler:
    min_workers: 1
    max_workers: 10
    scale_up_threshold: 15
    scale_down_threshold: 2
    check_interval: 200ms

ingot:
  max_quality: 100

item:
  max_quality: 100
  quality_bonus: 10

ore:
  max_capacity: 100
  number_of_ores: 3
  materials:
    - iron
    - copper
    - gold

storage:
  host: ${STORAGE_DB_HOST:-localhost}
  port: ${STORAGE_DB_PORT:-5432}
  name: ${STORAGE_DB_NAME:-mine}
  user: ${STORAGE_DB_USER:-mine}
  password: ${STORAGE_DB_PASSWORD}
